<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="step3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF5E4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="step3-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#step3-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#E0C375" stroke-width="0.7" opacity="0.3">
    <line x1="40" y1="50" x2="360" y2="50"/>
    <line x1="40" y1="150" x2="360" y2="150"/>
    <line x1="40" y1="250" x2="360" y2="250"/>
  </g>

  <!-- Washing and Flat Storing Illustration -->
  <g transform="translate(200, 130)">
    <!-- Water Tap -->
    <g transform="translate(0, -90)">
      <path d="M -16 0 L 16 0 L 10 18 L -10 18 Z" fill="#475569"/>
      <rect x="-6" y="18" width="12" height="12" rx="2" fill="#64748B"/>
      <!-- Flowing Water Splash Stream -->
      <path d="M -5 30 L -18 75 L 18 75 L 5 30 Z" fill="url(#step3-water)"/>
      <circle cx="-14" cy="85" r="3" fill="#38BDF8"/>
      <circle cx="12" cy="88" r="2.5" fill="#38BDF8"/>
      <circle cx="0" cy="92" r="3.5" fill="#0284C7"/>
    </g>

    <!-- 100% Flat Sheet Spoon under water stream -->
    <rect x="-42" y="-20" width="84" height="125" rx="10" fill="#D92143" stroke="#E0C375" stroke-width="1.8" transform="rotate(-10 0 40)"/>
    
    <!-- Sparkle Stars (Clean Indicator) -->
    <path d="M 50,-10 L 53,2 L 65,5 L 53,8 L 50,20 L 47,8 L 35,5 L 47,2 Z" fill="#FBBF24"/>
    <path d="M -55,40 L -53,48 L -45,50 L -53,52 L -55,60 L -57,52 L -65,50 L -57,48 Z" fill="#FBBF24"/>

    <!-- Interactive Step Badge -->
    <rect x="-65" y="105" width="130" height="26" rx="13" fill="#FEF5E4" stroke="#E0C375" stroke-width="1.5"/>
    <text x="0" y="122" fill="#B45309" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✨ ১ সেকেন্ডে পরিষ্কার</text>
  </g>
</svg>
