<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="spoonSilicone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="spoonSiliconeFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle kitchen grid backdrop -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748B" stroke-width="1" />
    </pattern>
    <rect width="800" height="600" fill="url(#grid)" />
  </g>

  <!-- Main Card Showcase -->
  <!-- Left Side: Flat State (0% Space) -->
  <g transform="translate(80, 100)" filter="url(#cardShadow)">
    <rect width="280" height="380" rx="20" fill="#FFFFFF" />
    <rect x="0" y="0" width="280" height="8" rx="4" fill="#10B981" />
    
    <!-- Flat Spoon Graphic -->
    <g transform="translate(40, 50)">
      <!-- Flat body -->
      <rect x="50" y="20" width="100" height="240" rx="14" fill="url(#spoonSilicone)" />
      <!-- Origami score lines -->
      <line x1="75" y1="40" x2="75" y2="240" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4,4" />
      <line x1="125" y1="40" x2="125" y2="240" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4,4" />
      <line x1="50" y1="100" x2="150" y2="100" stroke="#6EE7B7" stroke-width="2" />
      <line x1="50" y1="160" x2="150" y2="160" stroke="#6EE7B7" stroke-width="2" />
      
      <!-- Text markings -->
      <text x="100" y="80" fill="#ECFDF5" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">1 Tbsp (১৫ মিলি)</text>
      <text x="100" y="140" fill="#ECFDF5" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">1/2 Tsp (৫ মিলি)</text>
      <text x="100" y="200" fill="#ECFDF5" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">1/4 Tsp (১.২৫ মিলি)</text>
      
      <circle cx="100" cy="245" r="5" fill="#FFFFFF" />
    </g>

    <!-- Badge -->
    <rect x="30" y="320" width="220" height="36" rx="18" fill="#ECFDF5" />
    <text x="140" y="343" fill="#047857" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">⚡ ফ্ল্যাট স্টেট (০% ড্রয়ার স্পেস)</text>
  </g>

  <!-- Right Side: Folded 3D Scoop State -->
  <g transform="translate(440, 100)" filter="url(#cardShadow)">
    <rect width="280" height="380" rx="20" fill="#FFFFFF" />
    <rect x="0" y="0" width="280" height="8" rx="4" fill="#EA580C" />
    
    <!-- 3D Folded Scoop Graphic -->
    <g transform="translate(30, 40)">
      <!-- Shadow under spoon -->
      <ellipse cx="110" cy="250" rx="60" ry="15" fill="#CBD5E1" opacity="0.6" />
      
      <!-- Folded Polygon Scoop -->
      <polygon points="60,60 160,60 175,180 110,240 45,180" fill="url(#spoonSiliconeFold)" />
      <!-- Polygon Facets -->
      <polygon points="60,60 110,240 45,180" fill="#047857" opacity="0.3" />
      <polygon points="160,60 110,240 175,180" fill="#064E3B" opacity="0.4" />
      <polygon points="75,80 145,80 155,160 110,200 65,160" fill="#D1FAE5" opacity="0.9" />

      <!-- Spices inside scoop -->
      <circle cx="110" cy="130" r="22" fill="#F59E0B" />
      <circle cx="100" cy="120" r="14" fill="#D97706" />
      <circle cx="120" cy="135" r="10" fill="#B45309" />

      <!-- Measurement callout -->
      <g transform="translate(15, 110)">
        <rect width="80" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
        <text x="40" y="16" fill="#B45309" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">1 Tbsp মাপ</text>
      </g>
    </g>

    <!-- Badge -->
    <rect x="30" y="320" width="220" height="36" rx="18" fill="#FFF7ED" />
    <text x="140" y="343" fill="#C2410C" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">✨ ফোল্ডেড ৩ডি স্কুপ স্টেট</text>
  </g>

  <!-- Central Transformation Arrow Badge -->
  <g transform="translate(370, 260)" filter="url(#cardShadow)">
    <circle cx="30" cy="30" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="4" />
    <!-- Arrow icon -->
    <path d="M 22 30 L 38 30 M 32 23 L 39 30 L 32 37" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
